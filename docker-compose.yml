# 一键部署：应用 + MySQL 8.4 + EMQX 5.8 + Modbus TCP 模拟器
#
# 首次部署：bash deploy.sh
# 手工启动：docker compose up -d --build
# 状态：docker compose ps
# 日志：docker compose logs -f app
# 停止：docker compose down
# 清库重建：docker compose down -v && bash deploy.sh
# 连库（仅宿主机）：mysql -h 127.0.0.1 -P 3306 -uroot -p
# EMQX 控制台（仅宿主机，建议 SSH 隧道）：http://127.0.0.1:18083

name: donghuan

services:
  mysql:
    image: mysql:8.4
    container_name: dh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: "donghuan"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 只绑宿主机，公网不可直连
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/docker-init.sql:/docker-entrypoint-initdb.d/03-docker.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  emqx:
    image: emqx/emqx:5.8
    container_name: dh-emqx
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      # 1883 对公网开放，需配合 EMQX 账号认证；8083/18083 仍只绑宿主机
      - "1883:1883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log

  modbus:
    build:
      context: ./scripts
      dockerfile: Dockerfile.modbus
    container_name: dh-modbus
    restart: unless-stopped
    # 只在 compose 网络内提供，不映射到宿主机
    volumes:
      - ./scripts/modbus_simulator.py:/app/modbus_simulator.py:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dh-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      emqx:
        condition: service_started
      modbus:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/donghuan?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MQTT_BROKER: "tcp://emqx:1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-donghuan}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql-data:
  emqx-data:
  emqx-log:
