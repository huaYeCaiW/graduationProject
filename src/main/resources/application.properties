spring.application.name=dongHuan

#服务器端口
server.port=8080

#日志级别：全局info，本项目包下调成debug方便开发排查
logging.level.root=info
logging.level.com.donghuan=debug

#数据库
spring.datasource.url=jdbc:mysql://localhost:3306/donghuan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=<你的MySQL用户名>
spring.datasource.password=<你的MySQL密码>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#会话：登录态存 Session，30 分钟无操作过期
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=DH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
