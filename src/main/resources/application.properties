spring.application.name=dongHuan

#服务器端口
server.port=8080

#日志级别：全局info，本项目包下调成debug方便开发排查
logging.level.root=info
logging.level.com.donghuan=debug

# 引入业务配置文件（Spring Boot 2.4+ 机制）
spring.config.import=classpath:devices.yml

#数据库
spring.datasource.url=jdbc:mysql://localhost:3306/donghuan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

donghuan.store.type=jdbc